<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#4f46e5" />
  <title>MyTracker - Keuangan & Tugas</title>
  <link rel="manifest" href="./manifest.json" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { background-color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="text-slate-800 pb-24 max-w-md mx-auto min-h-screen shadow-xl bg-slate-50 relative">

  <!-- HEADER -->
  <header class="sticky top-0 z-20 bg-white/90 backdrop-blur-md border-b border-slate-200 px-4 py-3 flex items-center justify-between">
    <div>
      <h1 class="font-bold text-lg text-slate-900 leading-tight">MyTracker</h1>
      <div id="netStatus" class="flex items-center gap-1.5 text-xs text-emerald-600 font-medium">
        <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
        <span>Offline-First Ready</span>
      </div>
    </div>

    <button id="syncBtn" onclick="syncToSheets()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold bg-indigo-600 text-white active:scale-95 transition shadow-sm">
      <i data-lucide="refresh-cw" id="syncIcon" class="w-3.5 h-3.5"></i>
      <span id="syncText">Sync (0)</span>
    </button>
  </header>

  <!-- NOTIFIKASI TOAST -->
  <div id="toast" class="fixed top-16 left-1/2 -translate-x-1/2 z-50 hidden px-4 py-2 rounded-full text-xs font-medium text-white bg-slate-800 shadow-lg transition-all"></div>

  <!-- KONTEN UTAMA -->
  <main class="p-4 space-y-5">

    <!-- TAB 1: DASHBOARD -->
    <section id="view-dashboard" class="space-y-5">
      <!-- Kartu Saldo -->
      <div class="bg-gradient-to-br from-indigo-600 to-blue-700 rounded-2xl p-5 text-white shadow-md">
        <p class="text-xs text-indigo-100 uppercase tracking-wider font-medium">Sisa Saldo Saat Ini</p>
        <h2 id="dashSaldo" class="text-3xl font-extrabold mt-1">Rp 0</h2>
        <div class="grid grid-cols-2 gap-3 mt-4 pt-3 border-t border-white/20 text-xs">
          <div>
            <span class="text-indigo-200 block">Pemasukan</span>
            <span id="dashMasuk" class="font-bold text-emerald-300 text-sm">Rp 0</span>
          </div>
          <div>
            <span class="text-indigo-200 block">Pengeluaran</span>
            <span id="dashKeluar" class="font-bold text-rose-300 text-sm">Rp 0</span>
          </div>
        </div>
      </div>

      <!-- Tombol Cepat -->
      <div class="grid grid-cols-2 gap-3">
        <button onclick="openModal('modal-uang')" class="flex items-center justify-center gap-2 bg-white border border-slate-200 p-3.5 rounded-xl font-semibold text-sm text-slate-700 shadow-sm active:bg-slate-100">
          <i data-lucide="wallet" class="w-4 h-4 text-indigo-600"></i>
          <span>Catat Duit</span>
        </button>
        <button onclick="openModal('modal-tugas')" class="flex items-center justify-center gap-2 bg-white border border-slate-200 p-3.5 rounded-xl font-semibold text-sm text-slate-700 shadow-sm active:bg-slate-100">
          <i data-lucide="plus-circle" class="w-4 h-4 text-amber-500"></i>
          <span>Tugas Baru</span>
        </button>
      </div>

      <!-- Tugas Prioritas -->
      <div>
        <div class="flex items-center justify-between mb-2.5">
          <h3 class="font-bold text-sm text-slate-800">Deadline Terdekat</h3>
          <button onclick="switchTab('tugas')" class="text-xs text-indigo-600 font-semibold">Lihat Semua</button>
        </div>
        <div id="dashTugasList" class="space-y-2.5"></div>
      </div>
    </section>

    <!-- TAB 2: KEUANGAN -->
    <section id="view-keuangan" class="hidden space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="font-bold text-base text-slate-900">Riwayat Keuangan</h2>
        <button onclick="openModal('modal-uang')" class="bg-indigo-600 text-white text-xs font-semibold px-3 py-1.5 rounded-lg flex items-center gap-1">
          <i data-lucide="plus" class="w-3.5 h-3.5"></i> Tambah
        </button>
      </div>
      <div id="keuanganList" class="space-y-2.5"></div>
    </section>

    <!-- TAB 3: TUGAS KULIAH -->
    <section id="view-tugas" class="hidden space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="font-bold text-base text-slate-900">Tugas Kuliah</h2>
        <button onclick="openModal('modal-tugas')" class="bg-indigo-600 text-white text-xs font-semibold px-3 py-1.5 rounded-lg flex items-center gap-1">
          <i data-lucide="plus" class="w-3.5 h-3.5"></i> Tugas Baru
        </button>
      </div>

      <!-- Filter Status -->
      <div class="flex bg-slate-200/70 p-1 rounded-xl text-xs font-semibold">
        <button id="filterPending" onclick="setTugasFilter('Pending')" class="flex-1 py-1.5 rounded-lg bg-white text-indigo-600 shadow-sm transition">Belum Selesai</button>
        <button id="filterDone" onclick="setTugasFilter('Done')" class="flex-1 py-1.5 rounded-lg text-slate-600 transition">Selesai (Done)</button>
      </div>

      <div id="tugasList" class="space-y-2.5"></div>
    </section>

  </main>

  <!-- BOTTOM NAVIGATION -->
  <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-white border-t border-slate-200 flex justify-around py-2 z-20">
    <button onclick="switchTab('dashboard')" id="nav-dashboard" class="flex flex-col items-center gap-1 text-indigo-600 text-[11px] font-semibold">
      <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
      <span>Dashboard</span>
    </button>
    <button onclick="switchTab('keuangan')" id="nav-keuangan" class="flex flex-col items-center gap-1 text-slate-400 text-[11px] font-medium">
      <i data-lucide="banknote" class="w-5 h-5"></i>
      <span>Keuangan</span>
    </button>
    <button onclick="switchTab('tugas')" id="nav-tugas" class="flex flex-col items-center gap-1 text-slate-400 text-[11px] font-medium">
      <i data-lucide="check-square" class="w-5 h-5"></i>
      <span>Tugas</span>
    </button>
  </nav>

  <!-- MODAL INPUT KEUANGAN -->
  <div id="modal-uang" class="fixed inset-0 bg-slate-900/50 z-40 hidden flex items-end sm:items-center justify-center">
    <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl p-5 space-y-4">
      <div class="flex justify-between items-center">
        <h3 class="font-bold text-base">Catat Transaksi</h3>
        <button onclick="closeModal('modal-uang')" class="text-slate-400"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <form onsubmit="simpanKeuangan(event)" class="space-y-3">
        <div class="grid grid-cols-2 gap-2">
          <label class="cursor-pointer">
            <input type="radio" name="jenis" value="Pengeluaran" checked class="peer hidden" />
            <div class="text-center py-2 rounded-xl border border-slate-200 text-xs font-semibold peer-checked:bg-rose-50 peer-checked:border-rose-500 peer-checked:text-rose-600">Pengeluaran</div>
          </label>
          <label class="cursor-pointer">
            <input type="radio" name="jenis" value="Pemasukan" class="peer hidden" />
            <div class="text-center py-2 rounded-xl border border-slate-200 text-xs font-semibold peer-checked:bg-emerald-50 peer-checked:border-emerald-500 peer-checked:text-emerald-600">Pemasukan</div>
          </label>
        </div>
        <div>
          <label class="text-xs font-medium text-slate-600">Nominal (Rp)</label>
          <input type="number" id="uangNominal" required placeholder="Contoh: 15000" class="w-full mt-1 px-3 py-2 border border-slate-300 rounded-xl text-sm focus:outline-indigo-600" />
        </div>
        <div>
          <label class="text-xs font-medium text-slate-600">Kategori</label>
          <select id="uangKategori" class="w-full mt-1 px-3 py-2 border border-slate-300 rounded-xl text-sm bg-white">
            <option value="Makan & Minum">Makan & Minum</option>
            <option value="Transport / Bensin">Transport / Bensin</option>
            <option value="Kebutuhan Kuliah">Kebutuhan Kuliah</option>
            <option value="Jajan / Hiburan">Jajan / Hiburan</option>
            <option value="Uang Saku / Gaji">Uang Saku / Pemasukan</option>
            <option value="Tabungan">Tabungan</option>
            <option value="Lainnya">Lainnya</option>
          </select>
        </div>
        <div>
          <label class="text-xs font-medium text-slate-600">Catatan</label>
          <input type="text" id="uangCatatan" placeholder="Contoh: Ayam geprek / Print laporan" class="w-full mt-1 px-3 py-2 border border-slate-300 rounded-xl text-sm" />
        </div>
        <button type="submit" class="w-full py-2.5 bg-indigo-600 text-white font-semibold rounded-xl text-sm">Simpan (Offline)</button>
      </form>
    </div>
  </div>

  <!-- MODAL INPUT TUGAS -->
  <div id="modal-tugas" class="fixed inset-0 bg-slate-900/50 z-40 hidden flex items-end sm:items-center justify-center">
    <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl p-5 space-y-4">
      <div class="flex justify-between items-center">
        <h3 class="font-bold text-base">Tambah Tugas Kuliah</h3>
        <button onclick="closeModal('modal-tugas')" class="text-slate-400"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <form onsubmit="simpanTugas(event)" class="space-y-3">
        <div>
          <label class="text-xs font-medium text-slate-600">Mata Kuliah</label>
          <input type="text" id="tugasMatkul" required placeholder="Contoh: Struktur Data" class="w-full mt-1 px-3 py-2 border border-slate-300 rounded-xl text-sm" />
        </div>
        <div>
          <label class="text-xs font-medium text-slate-600">Judul / Deskripsi Tugas</label>
          <input type="text" id="tugasJudul" required placeholder="Contoh: Laporan Praktikum Modul 3" class="w-full mt-1 px-3 py-2 border border-slate-300 rounded-xl text-sm" />
        </div>
        <div>
          <label class="text-xs font-medium text-slate-600">Deadline</label>
          <input type="datetime-local" id="tugasDeadline" required class="w-full mt-1 px-3 py-2 border border-slate-300 rounded-xl text-sm" />
        </div>
        <button type="submit" class="w-full py-2.5 bg-indigo-600 text-white font-semibold rounded-xl text-sm">Simpan Tugas (Offline)</button>
      </form>
    </div>
  </div>

  <script>
    // =========================================================================
    // TEMPEL URL WEB APP GOOGLE APPS SCRIPT KAMU DI BAWAH INI:
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzHPqpNSjvohXDvxezNAHmKBJfFiwq-9_Qd3Cjw3feuZhtTDX4yKLXYB4D2XmdNlCKM/exec";
    // =========================================================================

    let dataKeuangan = JSON.parse(localStorage.getItem('mt_keuangan')) || [];
    let dataTugas = JSON.parse(localStorage.getItem('mt_tugas')) || [];
    let currentTugasFilter = 'Pending';

    // Registrasi Service Worker untuk Mode Full Offline
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW gagal:', err));
    }

    // Monitor status jaringan HP
    function updateOnlineStatus() {
      const el = document.getElementById('netStatus');
      if (navigator.onLine) {
        el.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500"></span><span>Online • Siap Sync</span>`;
        el.className = "flex items-center gap-1.5 text-xs text-emerald-600 font-medium";
      } else {
        el.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-500"></span><span>Mode Offline (Tersimpan di HP)</span>`;
        el.className = "flex items-center gap-1.5 text-xs text-amber-600 font-medium";
      }
    }
    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.remove('hidden');
      setTimeout(() => t.classList.add('hidden'), 2500);
    }

    function formatRupiah(angka) {
      return 'Rp ' + Number(angka).toLocaleString('id-ID');
    }

    function saveLocal() {
      localStorage.setItem('mt_keuangan', JSON.stringify(dataKeuangan));
      localStorage.setItem('mt_tugas', JSON.stringify(dataTugas));
      renderAll();
    }

    // --- KEUANGAN ---
    function simpanKeuangan(e) {
      e.preventDefault();
      const jenis = document.querySelector('input[name="jenis"]:checked').value;
      const nominal = Number(document.getElementById('uangNominal').value);
      const kategori = document.getElementById('uangKategori').value;
      const catatan = document.getElementById('uangCatatan').value || '-';
      const tanggal = new Date().toISOString().split('T')[0];

      dataKeuangan.unshift({
        id: 'trx-' + Date.now(),
        tanggal,
        jenis,
        kategori,
        nominal,
        catatan,
        isSynced: false
      });

      e.target.reset();
      closeModal('modal-uang');
      saveLocal();
      showToast('Transaksi disimpan di HP!');
    }

    // --- TUGAS ---
    function simpanTugas(e) {
      e.preventDefault();
      const matkul = document.getElementById('tugasMatkul').value;
      const judul_tugas = document.getElementById('tugasJudul').value;
      const rawDeadline = document.getElementById('tugasDeadline').value;
      const deadline = rawDeadline.replace('T', ' ');

      dataTugas.push({
        id: 'tgs-' + Date.now(),
        matkul,
        judul_tugas,
        deadline,
        status: 'Pending',
        isSynced: false
      });

      e.target.reset();
      closeModal('modal-tugas');
      saveLocal();
      showToast('Tugas disimpan di HP!');
    }

    function toggleTugasStatus(id) {
      const idx = dataTugas.findIndex(t => t.id === id);
      if (idx > -1) {
        dataTugas[idx].status = dataTugas[idx].status === 'Pending' ? 'Done' : 'Pending';
        dataTugas[idx].isSynced = false; // Tandai butuh sync ulang ke Sheets
        saveLocal();
        showToast(dataTugas[idx].status === 'Done' ? 'Tugas selesai! Mantap!' : 'Tugas dikembalikan ke Pending');
      }
    }

    function setTugasFilter(status) {
      currentTugasFilter = status;
      document.getElementById('filterPending').className = status === 'Pending'
        ? 'flex-1 py-1.5 rounded-lg bg-white text-indigo-600 shadow-sm transition'
        : 'flex-1 py-1.5 rounded-lg text-slate-600 transition';
      document.getElementById('filterDone').className = status === 'Done'
        ? 'flex-1 py-1.5 rounded-lg bg-white text-indigo-600 shadow-sm transition'
        : 'flex-1 py-1.5 rounded-lg text-slate-600 transition';
      renderTugas();
    }

    // --- SINKRONISASI KE GOOGLE SHEETS ---
    async function syncToSheets() {
      if (!navigator.onLine) {
        showToast('Kamu sedang offline. Nyalakan internet untuk Sync.');
        return;
      }
      if (SCRIPT_URL.includes("TEMPEL_URL")) {
        showToast('Error: URL Apps Script belum dipasang di index.html!');
        return;
      }

      const unsyncedKeuangan = dataKeuangan.filter(k => !k.isSynced);
      const unsyncedTugas = dataTugas.filter(t => !t.isSynced);

      if (unsyncedKeuangan.length === 0 && unsyncedTugas.length === 0) {
        showToast('Semua data sudah tersinkron dengan Google Sheets!');
        return;
      }

      const icon = document.getElementById('syncIcon');
      const text = document.getElementById('syncText');
      icon.classList.add('animate-spin');
      text.textContent = 'Syncing...';

      try {
        // Gunakan text/plain agar terhindar dari CORS preflight block pada Apps Script
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            keuangan: unsyncedKeuangan,
            tugas: unsyncedTugas
          })
        });

        const result = await response.json();
        if (result.status === 'success') {
          dataKeuangan.forEach(k => k.isSynced = true);
          dataTugas.forEach(t => t.isSynced = true);
          saveLocal();
          showToast('Berhasil Sync ke Google Sheets!');
        } else {
          showToast('Gagal Sync: ' + result.message);
        }
      } catch (err) {
        showToast('Gagal terhubung ke Google Sheets.');
        console.error(err);
      } finally {
        icon.classList.remove('animate-spin');
        updateSyncCounter();
      }
    }

    function updateSyncCounter() {
      const count = dataKeuangan.filter(k => !k.isSynced).length + dataTugas.filter(t => !t.isSynced).length;
      document.getElementById('syncText').textContent = `Sync (${count})`;
    }

    // --- RENDER TAMPILAN ---
    function getDeadlineBadge(deadlineStr, status) {
      if (status === 'Done') return `<span class="text-[10px] px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700 font-semibold">Selesai</span>`;
      const diffHours = (new Date(deadlineStr) - new Date()) / (1000 * 60 * 60);
      if (diffHours < 0) return `<span class="text-[10px] px-2 py-0.5 rounded-full bg-rose-600 text-white font-semibold">Terlewat!</span>`;
      if (diffHours <= 24) return `<span class="text-[10px] px-2 py-0.5 rounded-full bg-rose-100 text-rose-700 font-semibold">< 24 Jam</span>`;
      if (diffHours <= 72) return `<span class="text-[10px] px-2 py-0.5 rounded-full bg-amber-100 text-amber-700 font-semibold">< 3 Hari</span>`;
      return `<span class="text-[10px] px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 font-medium">Aman</span>`;
    }

    function renderTugasCard(t) {
      const syncDot = t.isSynced
        ? `<i data-lucide="cloud-check" class="w-3.5 h-3.5 text-emerald-500"></i>`
        : `<i data-lucide="clock" class="w-3.5 h-3.5 text-amber-500"></i>`;

      return `
        <div class="bg-white p-3.5 rounded-xl border border-slate-200/80 shadow-sm flex items-center justify-between gap-3">
          <div class="space-y-1 flex-1">
            <div class="flex items-center gap-2">
              <span class="text-[11px] font-bold text-indigo-600 uppercase tracking-wide">${t.matkul}</span>
              ${getDeadlineBadge(t.deadline, t.status)}
              ${syncDot}
            </div>
            <p class="text-sm font-semibold text-slate-800 ${t.status === 'Done' ? 'line-through text-slate-400' : ''}">${t.judul_tugas}</p>
            <p class="text-xs text-slate-500 flex items-center gap-1">
              <i data-lucide="calendar" class="w-3 h-3"></i> ${t.deadline}
            </p>
          </div>
          <button onclick="toggleTugasStatus('${t.id}')" class="w-9 h-9 rounded-full flex items-center justify-center border transition ${t.status === 'Done' ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-300 text-slate-300 hover:border-indigo-500'}">
            <i data-lucide="check" class="w-5 h-5"></i>
          </button>
        </div>
      `;
    }

    function renderAll() {
      // 1. Hitung Saldo
      let masuk = 0, keluar = 0;
      dataKeuangan.forEach(k => {
        if (k.jenis === 'Pemasukan') masuk += k.nominal;
        else keluar += k.nominal;
      });
      document.getElementById('dashSaldo').textContent = formatRupiah(masuk - keluar);
      document.getElementById('dashMasuk').textContent = formatRupiah(masuk);
      document.getElementById('dashKeluar').textContent = formatRupiah(keluar);

      // 2. Render Dashboard Tugas (2 Terdekat)
      const pendingSorted = [...dataTugas]
        .filter(t => t.status === 'Pending')
        .sort((a, b) => new Date(a.deadline) - new Date(b.deadline));

      const dashTugasEl = document.getElementById('dashTugasList');
      dashTugasEl.innerHTML = pendingSorted.length
        ? pendingSorted.slice(0, 2).map(renderTugasCard).join('')
        : `<div class="bg-white p-4 rounded-xl border border-dashed border-slate-300 text-center text-xs text-slate-400">Tidak ada tanggungan tugas. Santai dulu!</div>`;

      // 3. Render List Keuangan
      const kList = document.getElementById('keuanganList');
      kList.innerHTML = dataKeuangan.length
        ? dataKeuangan.map(k => `
          <div class="bg-white p-3.5 rounded-xl border border-slate-200/80 shadow-sm flex items-center justify-between">
            <div>
              <div class="flex items-center gap-1.5">
                <span class="text-xs font-bold text-slate-800">${k.kategori}</span>
                ${k.isSynced ? '<i data-lucide="cloud-check" class="w-3.5 h-3.5 text-emerald-500"></i>' : '<i data-lucide="clock" class="w-3.5 h-3.5 text-amber-500"></i>'}
              </div>
              <p class="text-xs text-slate-500">${k.catatan} • ${k.tanggal}</p>
            </div>
            <span class="font-bold text-sm ${k.jenis === 'Pemasukan' ? 'text-emerald-600' : 'text-rose-600'}">
              ${k.jenis === 'Pemasukan' ? '+' : '-'}${formatRupiah(k.nominal)}
            </span>
          </div>
        `).join('')
        : `<div class="text-center py-8 text-xs text-slate-400">Belum ada catatan keuangan.</div>`;

      // 4. Render List Tugas
      renderTugas();
      updateSyncCounter();
      lucide.createIcons();
    }

    function renderTugas() {
      const filtered = [...dataTugas]
        .filter(t => t.status === currentTugasFilter)
        .sort((a, b) => new Date(a.deadline) - new Date(b.deadline));

      document.getElementById('tugasList').innerHTML = filtered.length
        ? filtered.map(renderTugasCard).join('')
        : `<div class="text-center py-8 text-xs text-slate-400">Tidak ada tugas di kategori ini.</div>`;
      lucide.createIcons();
    }

    function switchTab(tab) {
      ['dashboard', 'keuangan', 'tugas'].forEach(t => {
        document.getElementById('view-' + t).classList.toggle('hidden', t !== tab);
        const nav = document.getElementById('nav-' + t);
        nav.classList.toggle('text-indigo-600', t === tab);
        nav.classList.toggle('font-semibold', t === tab);
        nav.classList.toggle('text-slate-400', t !== tab);
      });
    }

    function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

    // Init awal
    updateOnlineStatus();
    renderAll();
  </script>
</body>
</html>
